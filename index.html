<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valença do Piauí | Dashboard APS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- HEADER -->
        <header class="top-header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-heartbeat"></i></div>
                <div class="logo-text">
                    <h1>GESCON - <span>VALENÇA DO PIAUÍ</span></h1>
                    <p>1º Quadrimestre 2026 · SIAPS</p>
                </div>
            </div>
            <div class="header-right">
                <span class="update-badge"><i class="fas fa-sync-alt"></i> 23/06/2026</span>
                <span class="period-badge">1º QUADRIMESTRE</span>
            </div>
        </header>

        <!-- MENU -->
        <nav class="nav-menu" id="navMenu">
            <a class="active" data-page="inicio"><i class="fas fa-home"></i> Visão Geral</a>
            <a data-page="esf"><i class="fas fa-users"></i> eSF</a>
            <a data-page="esb"><i class="fas fa-tooth"></i> eSB</a>
            <a data-page="emulti"><i class="fas fa-hand-holding-heart"></i> eMulti</a>
        </nav>

        <!-- HERO STATS -->
        <section class="hero-stats" id="heroStats"></section>

        <!-- PÁGINAS -->
        <div id="pageInicio" class="page active"></div>
        <div id="pageESF" class="page"></div>
        <div id="pageESB" class="page"></div>
        <div id="pageEMulti" class="page"></div>

        <!-- FOOTER -->
        <footer class="footer">
            <p><i class="fas fa-chart-simple"></i> Ministério da Saúde · SIAPS · Dados oficiais do 1º Quadrimestre 2026</p>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="dados.js"></script>
    <script src="script.js"></script>
</body>
</html>
